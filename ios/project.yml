# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate && open Arranged.xcodeproj
name: Arranged
options:
  bundleIdPrefix: com.arranged
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
configs:
  Debug: debug
  Release: release
targets:
  Arranged:
    type: application
    platform: iOS
    sources:
      - path: Arranged
    info:
      path: Arranged/Info.plist
      properties:
        CFBundleDisplayName: Arranged
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Used to show how far the restaurant is from you.
        NSCameraUsageDescription: Used to take a profile photo.
        NSPhotoLibraryUsageDescription: Used to choose a profile photo.
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arranged.app
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          # Simulator talks to the backend on your Mac. Use your Mac's LAN IP for a physical device.
          API_BASE_URL: http://localhost:3000/v1
        Release:
          API_BASE_URL: https://api.arranged.example.com/v1
  ArrangedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArrangedTests
    dependencies:
      - target: Arranged
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Arranged:
    build:
      targets:
        Arranged: all
        ArrangedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ArrangedTests]
    archive:
      config: Release
