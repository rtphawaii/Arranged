services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arranged
      POSTGRES_PASSWORD: arranged
      POSTGRES_DB: arranged
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arranged"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
